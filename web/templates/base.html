<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{% block title %}{% endblock %} — phoenix-ebook</title>
<style>
  :root {
    color-scheme: light;
    --text: #1a1a1a;
    --bg: #ffffff;
    --muted: #4b4b4b;
    --border: #767676;
    --accent: #0b4f8a;
    --error: #a3000e;
    --error-bg: #fdecea;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 1rem/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main {
    max-width: 40rem;
    margin: 0 auto;
    padding: 1rem 1rem 3rem;
  }
  h1 { font-size: 1.5rem; }
  h2 { font-size: 1.1rem; }
  fieldset {
    border: 1px solid var(--border);
    border-radius: 0.5rem;
    margin: 0 0 1.25rem;
    padding: 1rem;
  }
  legend { font-weight: 600; padding: 0 0.25rem; }
  label { display: block; font-weight: 600; margin: 1rem 0 0.25rem; }
  fieldset > label:first-of-type { margin-top: 0; }
  .hint { color: var(--muted); font-size: 0.9rem; margin: 0 0 0.35rem; }
  input[type="text"], input[type="number"], input[type="file"], textarea {
    width: 100%;
    padding: 0.5rem;
    border: 1px solid var(--border);
    border-radius: 0.25rem;
    font: inherit;
    color: inherit;
    background: var(--bg);
  }
  textarea { resize: vertical; }
  .checkbox { display: grid; grid-template-columns: 1.25rem 1fr; column-gap: 0.5rem; margin: 1rem 0; }
  .checkbox input { width: 1.25rem; height: 1.25rem; margin: 0.15rem 0 0; }
  .checkbox label { margin: 0; }
  .checkbox .hint { grid-column: 2; margin: 0.1rem 0 0; }
  details { margin: 0 0 1.25rem; }
  details.preview { margin: -0.5rem 0 1rem 1.75rem; }
  details.preview > summary { font-weight: normal; color: var(--accent); text-decoration: underline; }
  .pages {
    list-style: none;
    padding: 0;
    margin: 0 0 0.75rem;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(8.5rem, 1fr));
    gap: 0.75rem;
  }
  .page {
    aspect-ratio: 2 / 3;
    border: 1px solid var(--border);
    border-radius: 0.2rem;
    box-shadow: 0 1px 3px rgb(0 0 0 / 0.15);
    padding: 0.75rem 0.6rem;
    font-size: 0.8rem;
    line-height: 1.35;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  .page-title { font-weight: 700; font-size: 0.95rem; text-align: center; }
  details > summary {
    cursor: pointer;
    font-weight: 600;
    padding: 0.5rem 0;
  }
  .field-error {
    color: var(--error);
    font-weight: 600;
    margin: 0.25rem 0;
    white-space: pre-line;
  }
  #error-summary li { white-space: pre-line; }
  [aria-invalid="true"] { border-color: var(--error); }
  #error-summary {
    border: 2px solid var(--error);
    background: var(--error-bg);
    border-radius: 0.5rem;
    padding: 1rem;
    margin: 0 0 1.5rem;
  }
  #error-summary h2 { margin-top: 0; color: var(--error); }
  #error-summary a { color: var(--error); }
  button {
    font: inherit;
    font-weight: 600;
    padding: 0.6rem 1.25rem;
    border-radius: 0.3rem;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible,
  summary:focus-visible, [tabindex]:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }
  a { color: var(--accent); }
  #progress {
    border: 1px solid var(--border);
    border-radius: 0.5rem;
    padding: 1rem;
  }
  #progress h2 { margin-top: 0; }
  #progress-bar { width: 100%; height: 1rem; accent-color: var(--accent); }
  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
{% block style %}{% endblock %}
</style>
</head>
<body>
<main>
{% block main %}{% endblock %}
</main>
{% block script %}{% endblock %}
</body>
</html>
